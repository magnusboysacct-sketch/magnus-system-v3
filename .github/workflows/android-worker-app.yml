# Builds the "Magnus Workers" Android app (folder mobile/) and publishes it as a GitHub release.
# Install link (always the newest): https://github.com/<owner>/<repo>/releases/latest/download/magnus-workers.apk
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the release key file, base64
#   ANDROID_KEYSTORE_PASSWORD its password
name: Android worker app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-worker-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-worker-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the signing key is set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Prepare the Android project
        run: npx cap sync android

      - name: Build the signed app
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: magnus
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/magnus-workers.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "worker-app-v${{ github.run_number }}" "$RUNNER_TEMP/magnus-workers.apk" \
            --title "Magnus Workers app 1.0.${{ github.run_number }}" \
            --notes "Install on Android: open https://app.magnusboys.com/get-app on the phone." \
            --latest
