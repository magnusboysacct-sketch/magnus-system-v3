
[functions.admin-invite-user]
enabled = true
verify_jwt = true
import_map = "./functions/admin-invite-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-invite-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-invite-user/*.html" ]

[functions.magnus-ai]
enabled = true
verify_jwt = true
import_map = "./functions/magnus-ai/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/magnus-ai/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/magnus-ai/*.html" ]

[functions.send-payment-reminders]
enabled = true
verify_jwt = false
import_map = "./functions/send-payment-reminders/deno.json"
entrypoint = "./functions/send-payment-reminders/index.ts"

[functions.send-payslip-email]
enabled = true
verify_jwt = true
import_map = "./functions/send-payslip-email/deno.json"
entrypoint = "./functions/send-payslip-email/index.ts"

[functions.migrate-storage-to-private]
enabled = true
verify_jwt = true
import_map = "./functions/migrate-storage-to-private/deno.json"
entrypoint = "./functions/migrate-storage-to-private/index.ts"

[functions.portal-contract-signature-urls]
enabled = true
verify_jwt = true
import_map = "./functions/portal-contract-signature-urls/deno.json"
entrypoint = "./functions/portal-contract-signature-urls/index.ts"

[functions.photo-share-resolve]
enabled = true
verify_jwt = true
import_map = "./functions/photo-share-resolve/deno.json"
entrypoint = "./functions/photo-share-resolve/index.ts"

# The photo on the public ID verify pages: a signed URL (5 minutes) for the profile / passport photo of the card that was scanned. Called with the anon key (a JWT).
[functions.verify-photo]
enabled = true
verify_jwt = true
import_map = "./functions/verify-photo/deno.json"
entrypoint = "./functions/verify-photo/index.ts"

# JWT verification for the portal functions, matching what is live (checked 2026-10-13 with `supabase functions list`),
# so a future deploy cannot flip it. Browser callers send the anon key, which is a valid JWT.
[functions.client-portal-login]
enabled = true
verify_jwt = true

[functions.client-password-reset]
enabled = true
verify_jwt = true

[functions.portal-sign-contract]
enabled = true
verify_jwt = true

# Auth email templates. The links point at our own domain ({{ .SiteURL }}/auth/confirm?token_hash=...) instead of <project>.supabase.co so Gmail does not flag them.
# These apply to a local `supabase start`. The live project's templates are set in the dashboard (Authentication -> Emails -> Templates); see supabase/templates/README.md.
# Do NOT run `supabase config push` for this: this file has no [auth] section for the rest of the live auth settings, and a push would write the defaults over them.
[auth.email.template.confirmation]
subject = "Confirm your Magnus Boy's System account"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your Magnus Boy's System password"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.magic_link]
subject = "Your Magnus Boy's System sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.invite]
subject = "You have been invited to Magnus Boy's System"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new email address for Magnus Boy's System"
content_path = "./supabase/templates/change-email.html"
