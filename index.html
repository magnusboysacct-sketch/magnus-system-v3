<!doctype html>
<html lang="en" class="dark" style="background-color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1b2a6b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Magnus Boy's" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnus Boy's System</title>
    <meta name="description" content="Construction management ERP for Jamaica and the Caribbean" />
    <!-- Link previews (WhatsApp, Facebook, iMessage, X): a dedicated 1200x630 share image with the logo centred on navy, so a square or
         rounded crop still shows it whole. Absolute URLs are required by these scrapers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Magnus Boy's System" />
    <meta property="og:url" content="https://app.magnusboys.com/" />
    <meta property="og:title" content="Magnus Boy's System" />
    <meta property="og:description" content="Construction management ERP for Jamaica and the Caribbean" />
    <meta property="og:image" content="https://app.magnusboys.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Magnus Boy's logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Magnus Boy's System" />
    <meta name="twitter:description" content="Construction management ERP for Jamaica and the Caribbean" />
    <meta name="twitter:image" content="https://app.magnusboys.com/og-image.png" />
    <style>
      #initial-splash {
        position: fixed; inset: 0; background: linear-gradient(135deg, #f8fafc, #eff6ff); z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #initial-splash img {
        width: 160px; height: 160px; object-fit: contain;
        margin-bottom: 24px;
      }
      #initial-splash h1 { color: #1e293b; font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
      #initial-splash p { color: #64748b; font-size: 13px; margin: 4px 0 0; }
      #initial-splash .loading-track {
        width: 192px; height: 6px; margin-top: 32px; border-radius: 9999px;
        background: #f1f5f9; overflow: hidden;
      }
      #initial-splash .loading-bar {
        height: 100%; border-radius: 9999px;
        background: linear-gradient(90deg, #ef4444, #1d4ed8);
        animation: initialSplashSlide 1.5s ease-in-out infinite;
      }
      @keyframes initialSplashSlide {
        0%   { width: 0%;  margin-left: 0%; }
        50%  { width: 70%; margin-left: 15%; }
        100% { width: 0%;  margin-left: 100%; }
      }
    </style>
  </head>
  <body style="background-color: #f8fafc; margin: 0;">
    <div id="root" style="background-color: #f8fafc; min-height: 100dvh;"></div>
    <div id="initial-splash">
      <img src="/icon-512x512.png" alt="Magnus Boys Construction"/>
      <h1>Magnus Boy's System</h1>
      <p>Construction ERP</p>
      <div class="loading-track"><div class="loading-bar"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
