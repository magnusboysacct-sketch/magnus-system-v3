<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MB Field" />
    <link rel="icon" type="image/svg+xml" href="/app-logo.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnus Boys Construction ERP</title>
    <style>
      #initial-splash {
        position: fixed; inset: 0; background: #0a0f1a; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #initial-splash .logo-box {
        width: 80px; height: 80px; border-radius: 20px; margin-bottom: 16px;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 20px 60px rgba(6, 182, 212, 0.3);
      }
      #initial-splash h1 { color: #fff; font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
      #initial-splash p { color: #94a3b8; font-size: 13px; margin: 4px 0 0; }
      #initial-splash .loading-track {
        width: 192px; height: 4px; margin-top: 32px; border-radius: 9999px;
        background: #1e293b; overflow: hidden;
      }
      #initial-splash .loading-bar {
        height: 100%; border-radius: 9999px;
        background: linear-gradient(90deg, #06b6d4, #2563eb);
        animation: initialSplashSlide 1.5s ease-in-out infinite;
      }
      @keyframes initialSplashSlide {
        0%   { width: 0%;  margin-left: 0%; }
        50%  { width: 70%; margin-left: 15%; }
        100% { width: 0%;  margin-left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-splash">
      <div class="logo-box">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <path d="M8 32L20 8L32 32" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 24H28" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Magnus System</h1>
      <p>Construction ERP</p>
      <div class="loading-track"><div class="loading-bar"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
